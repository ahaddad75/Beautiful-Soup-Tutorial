name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Le JSON des sessions est valide
        run: python -c "import json; json.load(open('data/sessions.json'))"
